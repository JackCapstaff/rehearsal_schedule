<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Rehearsal Schedule" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="wrap" style="display:flex; align-items:center; justify-content:space-between;">
      <div><strong>Rehearsal Schedule</strong> <span class="small" style="margin-left:8px;">{{ subtitle or "" }}</span></div>
      <div style="display:flex; align-items:center; gap:12px;">
        {% if user %}
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="text-align:right;">
              <div style="font-size:13px;">{{ user.email }}</div>
              {% if user.is_admin %}
                <div class="small" style="opacity:0.8;">Admin access enabled</div>
              {% endif %}
            </div>
            {% if user.is_admin %}
              <a href="{{ url_for('admin_home') }}" class="btn btn-sm" style="padding:4px 10px; background:#374151;">
                <i class="bi bi-gear"></i> Admin
              </a>
            {% endif %}
            <a href="{{ url_for('logout_view') }}" class="btn btn-sm" style="padding:4px 10px; background:#374151;">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </div>
        {% else %}
          <a href="{{ url_for('my_view') }}">Public View</a>
        {% endif %}
        {% if edit_link %}
          <span class="small" style="margin:0 8px;">|</span>
          <a href="{{ edit_link }}">Edit</a>
        {% endif %}
      </div>
    </div>
  </header>

  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
